global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "alert-fatigue-buster-backend"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["backend:8000"]
        labels:
          app: "alert-fatigue-buster"
          env: "production"

  - job_name: "prometheus"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["localhost:9090"]
